# Profile of source fidelity for staged venue photography: permanent structure must hold; dressing
# may change and may cover structure. The furniture exemption waives nothing: a consumer permits a
# specific structural change with a job requirement of kind `allowed` that waives SF1 and states its
# condition.
[rules]
use_case = "source-fidelity"
profile = "architecture"
extends = "source-fidelity"
version = 3

[[rule]]
id = "SF1"
kind = "must_hold"
scope = ["candidate"]
evidence = ["source"]
hidden_ok = true
text = "Permanent structure (walls, floors, ceilings, columns, pools, roads, built landmarks) keeps its shape, position and extent relative to the source. Compare outlines and edges, not the overall look: a pool widened, an end rounded or a band of tile moved is a violation even when the scene reads the same. A close alignment is not evidence that structure held. A region a tool flags on permanent structure is not dismissed until you have looked at it with view beside the same box of the source."

[[rule]]
id = "SF3"
kind = "allowed"
waives = []
text = "Furniture, people, vehicles, decoration, textiles, lighting and vegetation may change, appear or disappear."

[hints.regions]
preserve = ["wall", "floor", "ceiling", "column", "swimming pool", "building", "road"]
ignore = ["chair", "table", "person", "plant", "curtain", "lamp", "car"]

[hints.outline]
classes = ["swimming pool", "building", "column"]

# Run before the model's first turn, so its first look already has the shape comparison and the
# change regions (an earlier baseline: the model left both uncalled in every run). outline and
# regions run after align, which they require.
[screen]
tools = ["outline", "regions"]
