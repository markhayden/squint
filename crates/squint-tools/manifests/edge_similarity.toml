# The built-in edge similarity tool (SPEC "Transports", task 4.3c).
[tool]
name = "edge_similarity"
version = "1.0.0"
purpose = "Scores how much two frames share the same edges: the correlation of their edge-strength maps, 1 for the same structure, near 0 for unrelated or featureless frames."
when_to_use = "After align, between the aligned candidate and the source, to tell a restyle that kept the structure from one that moved or removed it."
when_not_to_use = "Between frames that are not in one grid, such as a raw candidate and a raw source that align has not registered; the score would measure the misalignment."
output_guidance = "A number, not a verdict: compare it with what you see. Shared edges survive colour and tone changes; a low score with a registered alignment points at changed structure."
cost = { tier = "cheap", seconds = 1.0 }
requires = ["align"]
frame_args = ["frame", "against"]
returns = { max_images = 0, max_long_edge = 1024, max_image_bytes = 0, max_summary_bytes = 2048, max_regions = 0, max_region_label_bytes = 0, max_measurements = 2, max_transforms = 0, max_envelope_bytes = 16_384 }
preconditions = "`frame` and `against` share one grid: an aligned frame and the frame it was aligned into, or two frames of one image."

[tool.model_schema]
type = "object"
additionalProperties = false
required = ["frame", "against"]
[tool.model_schema.properties.frame]
type = "string"
description = "One frame, usually the source: a frame id (raw:source), or an image id (source) for its raw frame."
[tool.model_schema.properties.against]
type = "string"
description = "The frame to compare it with, usually the aligned candidate (aligned:candidate:t1): a frame id, or an image id (candidate) for its raw frame (raw:candidate)."

[tool.input_schema]
type = "object"
additionalProperties = false
required = ["frame", "against", "_squint"]
[tool.input_schema.properties.frame]
type = "string"
[tool.input_schema.properties.against]
type = "string"
[tool.input_schema.properties._squint]
type = "object"

[tool.output_schema]
type = "object"
[tool.output_schema.properties.measurements]
type = "array"
description = "edge_similarity (ratio, -1 to 1) and edge_energy (the weaker frame's mean edge strength, intensity per pixel)."
