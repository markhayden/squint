# The built-in resize tool (SPEC "Transports", task 4.2a).
[tool]
name = "resize"
version = "1.0.0"
purpose = "Returns a frame scaled down to a chosen long edge, so the whole picture can be seen at a size the eye takes in at once."
when_to_use = "To step back from a large or detailed frame and judge its overall structure, or to compare two frames at one size."
when_not_to_use = "To see detail; use view for that. It never enlarges."
output_guidance = "The returned frame covers the same picture as the one you named at a smaller size; findings in it map back one to one."
cost = { tier = "cheap", seconds = 1.0 }
frame_args = ["frame"]
returns = { max_images = 1, max_long_edge = 1024, max_image_bytes = 4_000_000, max_summary_bytes = 2048, max_regions = 0, max_region_label_bytes = 0, max_measurements = 0, max_transforms = 0, max_envelope_bytes = 6_000_000 }
frames_out = ["crop"]

[tool.model_schema]
type = "object"
additionalProperties = false
required = ["frame", "long_edge"]
[tool.model_schema.properties.frame]
type = "string"
description = "The frame to scale down: a frame id (raw:candidate, or a crop a tool returned), or an image id (candidate) for its raw frame."
[tool.model_schema.properties.long_edge]
type = "integer"
minimum = 64
maximum = 1024
description = "The longer side of the result in pixels; at most the frame's own."

[tool.input_schema]
type = "object"
additionalProperties = false
required = ["frame", "long_edge", "_squint"]
[tool.input_schema.properties.frame]
type = "string"
[tool.input_schema.properties.long_edge]
type = "integer"
[tool.input_schema.properties._squint]
type = "object"

[tool.output_schema]
type = "object"
