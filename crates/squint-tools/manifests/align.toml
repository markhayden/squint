# The built-in align tool (SPEC "Transports", ADR 0014, tasks 4.3a and 4.3b).
[tool]
name = "align"
version = "1.0.0"
purpose = "Registers one image onto another of the same scene and viewpoint: a homography for flat images, a rotation on the sphere for panoramas; returns the first image warped into the second's frame with how well the pair agrees."
when_to_use = "Before comparing a candidate with its source: to see them in one frame and to learn whether the candidate kept the source's geometry."
when_not_to_use = "On images of different scenes or viewpoints; it reports those as not registered rather than forcing a fit."
output_guidance = "A registered pair gives an aligned frame to compare against the second image, and measurements of agreement. Not registered is itself evidence that the geometry changed; low texture means the images could not be judged."
cost = { tier = "moderate", seconds = 3.0 }
image_args = ["image", "against"]
evidence_kind = "alignment_failure"
returns = { max_images = 1, max_long_edge = 1024, max_image_bytes = 4_000_000, max_summary_bytes = 2048, max_regions = 1, max_region_label_bytes = 120, max_measurements = 8, max_transforms = 1, max_envelope_bytes = 6_000_000 }
frames_out = ["aligned"]
projections = ["visual_only"]

[tool.model_schema]
type = "object"
additionalProperties = false
required = ["image", "against"]
[tool.model_schema.properties.image]
type = "string"
description = "The image to register, usually the candidate: its image id (candidate) or its raw frame id (raw:candidate)."
[tool.model_schema.properties.against]
type = "string"
description = "The image to register onto, usually the source: its image id (source) or its raw frame id (raw:source); the aligned frame shares its grid."

[tool.input_schema]
type = "object"
additionalProperties = false
required = ["image", "against", "_squint"]
[tool.input_schema.properties.image]
type = "string"
[tool.input_schema.properties.against]
type = "string"
[tool.input_schema.properties._squint]
type = "object"

[tool.output_schema]
type = "object"
[tool.output_schema.properties.measurements]
type = "array"
description = "ncc (ratio), inlier_fraction (ratio), overlap (ratio), texture (intensity per pixel); translation_px, rotation_deg and scale for flat pairs; yaw_deg, pitch_deg and roll_deg for panoramas."
