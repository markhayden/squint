[workspace]
resolver = "3"
members = [
  "crates/squint-core",
  "crates/squint-providers",
  "crates/squint-tools",
  "crates/squint-eval",
  "crates/squint-testkit",
  "crates/squint-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/markhayden/squint"
rust-version = "1.99"

# The dependency list from SPEC.md "Tech stack". Entries no crate uses yet are declared here so a
# later task adds one line to its crate manifest and nothing else; anything outside this list
# needs an ADR. Versions are the crates.io releases current on 2026-10-26; entries no crate uses yet
# are not in Cargo.lock until first use.
[workspace.dependencies]
squint-core = { path = "crates/squint-core", version = "0.1.0" }
squint-providers = { path = "crates/squint-providers", version = "0.1.0" }
squint-tools = { path = "crates/squint-tools", version = "0.1.0" }
squint-eval = { path = "crates/squint-eval", version = "0.1.0" }
squint-testkit = { path = "crates/squint-testkit", version = "0.1.0" }

clap = { version = "4.6", features = ["derive"] }
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
schemars = "1.2"
jsonschema = { version = "0.60", default-features = false }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
sha2 = "0.11"
tracing = "0.1"
# Pinned exactly: squint conforms to one release of the contract, and an update is a deliberate
# commit with the copied schemas regenerated (ADR 0018, schemas/contract/SOURCES.toml).
table-manners = "=0.2.0"
# The official MCP SDK for `squint serve`, pinned exactly as rascal pins it (ADR 0018); the client
# squint uses for its tool packs stays in-house (ADR 0015).
rmcp = { version = "=3.8.0", default-features = false, features = ["server", "transport-io"] }
# Pinned exactly: the bootstrap's resample indices must reproduce from a seed across builds (ADR 0016).
rand = "=0.9.5"
rand_chacha = "=0.9.0"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "sync", "signal"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[workspace.lints.clippy]
all = "warn"
unwrap_used = "warn"

[workspace.lints.rust]
unsafe_code = "forbid"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
