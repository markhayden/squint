op = { kind = "generate", seed = 7204, prompt = "A photograph of a wooden shop shelf: four glass jars of dark jam in a row, each with a cream label that reads FOG JAM, and a small potted herb at the right end. No price tags, no hands.", violates = "BC3", about = "FIG JAM" }

