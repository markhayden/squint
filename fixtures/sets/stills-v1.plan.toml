# Dev set 3.3c: brief compliance, five briefs, four items each: generated from the brief as
# written (pass), with something asked for missing (BC1), with something forbidden present (BC2),
# and with the specified text misspelt (BC3). Every job is the candidate plus the brief.
[set]
id = "brief-compliance/stills-v1"
use_case = "brief-compliance"
split = "dev"
licence = "CC-BY-4.0"
images_repo = "github.com/markhayden/wafflery-evalsets"
rules = { base = "brief-compliance", version = 1 }

[[family]]
id = "cafe-window"
kind = "brief"
generator = "fal"
description = "a cafe window with a bicycle, two cups and an OPEN sign"
brief = "A photograph of a cafe window seen from the street: a red bicycle leaning on the wall below the window, two white coffee cups on the window sill, and a hanging sign in the window that reads OPEN. No people."
asks = ["a red bicycle leaning on the wall below the window", "two white coffee cups on the window sill", "a hanging sign that reads OPEN"]
forbids = ["people"]
text = ["OPEN"]
[[family.item]]
id = "cafe-window-asked"
op = { kind = "generate", seed = 7001 }
[[family.item]]
id = "cafe-window-no-cups"
op = { kind = "generate", seed = 7002, prompt = "A photograph of a cafe window seen from the street: a red bicycle leaning on the wall below the window, an empty window sill, and a hanging sign in the window that reads OPEN. No people.", violates = "BC1", about = "two white coffee cups on the window sill" }
[[family.item]]
id = "cafe-window-person"
op = { kind = "generate", seed = 7003, prompt = "A photograph of a cafe window seen from the street: a red bicycle leaning on the wall below the window, two white coffee cups on the window sill, a hanging sign in the window that reads OPEN, and a man in a coat standing at the cafe door.", violates = "BC2", about = "people" }
[[family.item]]
id = "cafe-window-misspelt"
op = { kind = "generate", seed = 7004, prompt = "A photograph of a cafe window seen from the street: a red bicycle leaning on the wall below the window, two white coffee cups on the window sill, and a hanging sign in the window that reads OPNE. No people.", violates = "BC3", about = "OPEN" }

[[family]]
id = "desk"
kind = "brief"
generator = "openai"
description = "a desk with three pencils and a MONDAY mug"
brief = "A photograph of a wooden desk from above: exactly three yellow pencils lying side by side, a white mug printed with the word MONDAY, and a closed green notebook. No laptop, no phone."
asks = ["exactly three yellow pencils lying side by side", "a white mug printed with the word MONDAY", "a closed green notebook"]
forbids = ["a laptop", "a phone"]
text = ["MONDAY"]
[[family.item]]
id = "desk-asked"
op = { kind = "generate", seed = 7101 }
[[family.item]]
id = "desk-five-pencils"
op = { kind = "generate", seed = 7102, prompt = "A photograph of a wooden desk from above: five yellow pencils lying side by side, a white mug printed with the word MONDAY, and a closed green notebook. No laptop, no phone.", violates = "BC1", about = "exactly three yellow pencils" }
[[family.item]]
id = "desk-laptop"
op = { kind = "generate", seed = 7103, prompt = "A photograph of a wooden desk from above: exactly three yellow pencils lying side by side, a white mug printed with the word MONDAY, a closed green notebook, and an open silver laptop.", violates = "BC2", about = "a laptop" }
[[family.item]]
id = "desk-misspelt"
op = { kind = "generate", seed = 7104, prompt = "A photograph of a wooden desk from above: exactly three yellow pencils lying side by side, a white mug printed with the word MONDAI in large clear letters facing the camera, and a closed green notebook. No laptop, no phone.", violates = "BC3", about = "MONDAY" }

