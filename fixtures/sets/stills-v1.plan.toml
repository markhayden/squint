asks = ["four glass jars of dark jam in a row", "cream labels that read FIG JAM", "a small potted herb at the right end"]
forbids = ["price tags", "hands"]
text = ["FIG JAM"]
[[family.item]]
id = "shelf-asked"
op = { kind = "generate", seed = 7201 }
[[family.item]]
id = "shelf-no-herb"
op = { kind = "generate", seed = 7202, prompt = "A photograph of a wooden shop shelf: four glass jars of dark jam in a row, each with a cream label that reads FIG JAM, nothing else on the shelf. No price tags, no hands.", violates = "BC1", about = "a small potted herb at the right end" }
[[family.item]]
id = "shelf-price-tags"
op = { kind = "generate", seed = 7203, prompt = "A photograph of a wooden shop shelf: four glass jars of dark jam in a row, each with a cream label that reads FIG JAM, a small potted herb at the right end, and a white price tag in front of each jar.", violates = "BC2", about = "price tags" }
[[family.item]]
