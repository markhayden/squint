# Dev set 3.3d: product fidelity, five products, four items each: the product placed in a
# scene from its packshot (pass), the label text changed (PF2), the colour changed (PF3), and a
# lookalike product generated without the packshot (PF1, PF2). Generators mixed by family.
[set]
id = "product-fidelity/packshots-v1"
use_case = "product-fidelity"
split = "dev"
licence = "CC-BY-4.0"
images_repo = "github.com/markhayden/wafflery-evalsets"
rules = { base = "product-fidelity", version = 1 }

[[family]]
id = "tonic"
kind = "subject"
generator = "fal"
description = "a tall green glass bottle of tonic water with a white oval label reading HARBOUR TONIC"
subject = "a tall green glass bottle with a white oval label that reads HARBOUR TONIC in black serif capitals and a silver screw cap"
protected = ["the white oval label reading HARBOUR TONIC", "the silver screw cap", "the green glass colour"]
references = [ { prompt = "Studio packshot of a tall green glass bottle with a white oval label that reads HARBOUR TONIC in black serif capitals and a silver screw cap, plain white background, soft even light.", seed = 8001 } ]
[[family.item]]
id = "tonic-bar"
scene = { prompt = "Photograph of the bottle standing on a dark wooden bar counter with a glass of ice beside it, warm light.", seed = 8011 }
[[family.item]]
id = "tonic-bar-label"
from = "tonic-bar"
op = { kind = "edit", prompt = "Change the label text so it reads HARBOR TONIC instead of HARBOUR TONIC, in the same typeface. Change nothing else.", alters = "white oval label reading HARBOUR TONIC", aspect = "label" }
[[family.item]]
id = "tonic-bar-amber"
from = "tonic-bar"
op = { kind = "edit", prompt = "Make the bottle's glass amber brown instead of green. Change nothing else.", alters = "green glass colour", aspect = "colour" }
[[family.item]]
id = "tonic-picnic-lookalike"
scene = { prompt = "Photograph of a bottle standing on a picnic blanket in a park, afternoon light.", seed = 8014 }
lookalike = "a short brown glass bottle with a round red label and a black cap"

