protected = ["Marlow's single white front paw", "the notch in Marlow's left ear"]
references = [
  { prompt = "Photograph of a grey tabby cat sitting upright facing the camera, its right front paw white and the other paws grey, a small notch missing from the tip of its left ear, green eyes, plain cream background.", seed = 201 },
  { prompt = "Photograph of the same grey tabby cat lying on a wooden floor, side view, the one white front paw visible, the notched left ear visible, window light.", seed = 202 },
]
[[family.item]]
id = "marlow-bookshop"
scene = { prompt = "Photograph of the cat sitting on a stack of books in a second-hand bookshop, warm lamplight.", seed = 211 }
[[family.item]]
id = "marlow-rooftop"
scene = { prompt = "Photograph of the cat on a tiled rooftop at dusk, city lights behind.", seed = 212 }
[[family.item]]
id = "marlow-bookshop-two-white-paws"
from = "marlow-bookshop"
op = { kind = "edit", prompt = "Make the cat's grey front paw white to match the other front paw, so both front paws are white and blend naturally. Change nothing else.", alters = "single white front paw" }
[[family.item]]
id = "marlow-garden-lookalike"
scene = { prompt = "Photograph of a cat sitting on a garden wall among ivy, morning light.", seed = 214 }
