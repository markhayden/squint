# The first dev set (task 3.2b): reference consistency, five subject families, four items each:
# two new scenes from the references (pass, confirmed by the owner), one marking edit (RC2) and
# one lookalike generated without the references (RC3). Generators mixed by family (ADR 0013).
[set]
id = "reference-consistency/pets-v1"
use_case = "reference-consistency"
split = "dev"
licence = "CC-BY-4.0"
images_repo = "github.com/markhayden/wafflery-evalsets"
rules = { base = "reference-consistency", version = 1 }

[[family]]
id = "pip"
kind = "subject"
generator = "fal"
description = "Pip, a golden retriever with a white chest patch and a red collar"
subject = "Pip, an adult golden retriever with a distinct white patch of fur on the chest and a plain red collar"
protected = ["Pip's white chest patch", "Pip's red collar"]
references = [
  { prompt = "Photograph of an adult golden retriever sitting and facing the camera, a distinct white patch of fur on the chest, a plain red collar, plain grey studio background, soft light.", seed = 101 },
  { prompt = "Photograph of the same adult golden retriever standing on short grass, three-quarter view, the white chest patch visible, a plain red collar, overcast daylight.", seed = 102 },
]
[[family.item]]
id = "pip-bridge"
scene = { prompt = "Photograph of the dog sitting on the bridge of a starship, consoles glowing, evening light.", seed = 111 }
[[family.item]]
id = "pip-beach"
scene = { prompt = "Photograph of the dog standing on a windy beach at low tide, grey sky.", seed = 112 }
[[family.item]]
id = "pip-bridge-no-patch"
from = "pip-bridge"
op = { kind = "edit", prompt = "Cover the white patch of fur on the dog's chest with light tan fur exactly like the fur around it, so no white patch remains and the chest looks like the rest of the coat. Change nothing else.", alters = "white chest patch" }
[[family.item]]
id = "pip-park-lookalike"
scene = { prompt = "Photograph of a dog sitting in a city park, autumn leaves, afternoon light.", seed = 114 }
lookalike = "an adult golden retriever with an all-golden chest, no white patch, wearing a blue collar"

[[family]]
id = "marlow"
