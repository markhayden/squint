# Dev set 3.3b: reality checks, five scene families of people, hands and signage, four items
# each: the clean image (pass), a clean restyle (pass), and two planted defects (anatomy, text,
# shadow or merge). Every job is the candidate alone. Generators mixed by family.
[set]
id = "reality-checks/people-v1"
use_case = "reality-checks"
split = "dev"
licence = "CC-BY-4.0"
images_repo = "github.com/markhayden/wafflery-evalsets"
rules = { base = "reality-checks", version = 1 }

[[family]]
id = "market"
generator = "fal"
description = "a market stall where a vendor hands a paper bag to a customer, a chalkboard reading FRESH PEARS"
brief = "A photograph of a fruit market stall."
source = { prompt = "A photograph of a fruit market stall: a vendor in an apron hands a brown paper bag to a customer, both hands clearly visible, a chalkboard sign on the stall reads FRESH PEARS in clear capitals, morning light, 35mm lens.", seed = 6001 }
[[family.item]]
id = "market-clean"
op = { kind = "as_is" }
[[family.item]]
id = "market-evening"
op = { kind = "restyle", prompt = "Change the light to warm evening sun. Keep every person, hand, object and the sign exactly as they are; change nothing else." }
[[family.item]]
id = "market-six-fingers"
op = { kind = "generate", seed = 6003, prompt = "A photograph of a fruit market stall: a vendor in an apron hands a brown paper bag to a customer; the vendor's open hand is raised flat towards the camera and has six fingers spread wide, the extra finger clearly visible; a chalkboard sign reads FRESH PEARS; morning light, 35mm lens.", defect = "anatomy", words = "the vendor's hand on the bag has six fingers" }
[[family.item]]
id = "market-garbled-sign"
op = { kind = "edit", prompt = "Replace the writing on the chalkboard with letter-like scribbles that spell no word. Change nothing else.", defect = "text", words = "the chalkboard sign is garbled letter-like scribbles instead of FRESH PEARS" }

[[family]]
id = "barista"
generator = "openai"
description = "a barista pouring milk into a cup at a counter, a menu board behind reading FLAT WHITE 4"
brief = "A photograph of a cafe counter."
source = { prompt = "A photograph of a barista at a cafe counter pouring milk from a steel jug into a cup held in the other hand, both hands clearly visible, a menu board behind reads FLAT WHITE 4 in clear letters, soft window light.", seed = 6101 }
[[family.item]]
id = "barista-clean"
op = { kind = "as_is" }
[[family.item]]
id = "barista-mono"
op = { kind = "restyle", prompt = "Make the photograph black and white. Keep every person, hand, object and the board exactly as they are; change nothing else." }
[[family.item]]
id = "barista-merged-hand"
op = { kind = "generate", seed = 6103, prompt = "A photograph of a barista at a cafe counter pouring milk into a cup; the hand holding the cup is fused with the cup, fingers and ceramic melting into one continuous surface; a menu board behind reads FLAT WHITE 4; soft window light.", defect = "merge", words = "the barista's hand is fused with the cup" }
[[family.item]]
id = "barista-garbled-board"
op = { kind = "edit", prompt = "Replace every word on the menu board behind the barista with letter-like scribbles that spell no word; keep the prices. Change nothing else.", defect = "text", words = "the menu board's words are garbled letter-like scribbles" }

[[family]]
id = "cyclist"
generator = "gemini"
description = "a cyclist stopped at a street corner beside a sign reading NORTH STREET"
brief = "A photograph of a street corner."
source = { prompt = "A photograph of a cyclist in a yellow jacket stopped at a street corner, one foot on the ground, both hands on the handlebars, a street name sign on the wall reads NORTH STREET in clear capitals, overcast daylight.", seed = 6201 }
[[family.item]]
id = "cyclist-clean"
op = { kind = "as_is" }
[[family.item]]
id = "cyclist-rain"
op = { kind = "restyle", prompt = "Make it just after rain: wet road reflecting the sky, grey light. Keep the cyclist, the bicycle, the sign and the framing exactly as they are; change nothing else." }
[[family.item]]
id = "cyclist-two-heads"
op = { kind = "generate", seed = 6203, prompt = "A photograph of a cyclist in a yellow jacket stopped at a street corner, one foot on the ground; the cyclist has two heads side by side on one body, both wearing helmets, clearly visible; a street name sign on the wall reads NORTH STREET; overcast daylight.", defect = "anatomy", words = "the cyclist has two heads" }
[[family.item]]
id = "cyclist-garbled-sign"
op = { kind = "edit", prompt = "Replace the street sign's letters with letter-like shapes that spell no word. Change nothing else.", defect = "text", words = "the street sign is garbled instead of NORTH STREET" }

[[family]]
id = "bus-stop"
generator = "fal"
description = "a woman at a bus stop holding a phone, a timetable board reading ROUTE 12"
brief = "A photograph of a bus stop."
source = { prompt = "A photograph of a woman standing at a bus stop holding a phone in one hand, the hand and phone clearly visible, a timetable board beside her reads ROUTE 12 in clear capitals, afternoon light.", seed = 6301 }
[[family.item]]
id = "bus-stop-clean"
op = { kind = "as_is" }
[[family.item]]
id = "bus-stop-dusk"
op = { kind = "restyle", prompt = "Change the time to dusk with the bus stop's light on. Keep the woman, the phone, the board and the framing exactly as they are; change nothing else." }
[[family.item]]
id = "bus-stop-phone-merge"
op = { kind = "generate", seed = 6303, prompt = "A photograph of a woman at a bus stop holding a phone; her fingers sink into the phone's screen and come out through its back as if it were not solid, phone and fingers merged into one object, close-up; a timetable board beside her reads ROUTE 12; afternoon light.", defect = "merge", words = "the woman's fingers pass through the phone" }
[[family.item]]
id = "bus-stop-fused-fingers"
op = { kind = "generate", seed = 6304, prompt = "A photograph of a woman at a bus stop holding a phone in a hand with seven fingers, all fingers clearly visible; a timetable board beside her reads ROUTE 12; afternoon light.", defect = "anatomy", words = "the hand holding the phone has seven fingers" }

[[family]]
id = "skatepark"
generator = "openai"
description = "a skateboarder standing with a board under one arm in front of a wall painted with the word RIDE"
brief = "A photograph of a skate park."
source = { prompt = "A photograph of a skateboarder standing in a skate park with a board under one arm, both hands clearly visible, a concrete wall behind painted with the single word RIDE in large clear letters, bright daylight.", seed = 6401 }
[[family.item]]
id = "skatepark-clean"
op = { kind = "as_is" }
[[family.item]]
id = "skatepark-sunset"
op = { kind = "restyle", prompt = "Change the light to low orange sunset light. Keep the skateboarder, the board, the wall and the framing exactly as they are; change nothing else." }
[[family.item]]
id = "skatepark-garbled-wall"
op = { kind = "edit", prompt = "Replace the painted word on the wall with letter-like shapes that spell no word. Change nothing else.", defect = "text", words = "the wall's word RIDE is garbled" }
[[family.item]]
id = "skatepark-wrong-shadow"
op = { kind = "edit", prompt = "Make the skateboarder's shadow fall towards the sun, opposite to every other shadow in the scene. Change nothing else.", defect = "shadow", words = "the skateboarder's shadow falls opposite to every other shadow" }
